<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning App Home — Mobile UI & Base Background Recreation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/Flip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/Draggable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollToPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/EasePack.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/TextPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/Observer.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-bg: #e2e3ea;
      --phone-width: 320px;
      --phone-height: 680px;
      --phone-radius: 26px;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 45%, #ececf2 0%, #dfe0e8 60%, #d5d6e0 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px 44px;
      color: #1b1536;
      overflow-x: hidden;
    }

    /* Ambient multi-layered phone drop shadow matching reference */
    .phone-frame {
      position: relative;
      width: var(--phone-width);
      height: var(--phone-height);
      border-radius: var(--phone-radius);
      background: #ffffff;
      overflow: hidden;
      box-shadow:
        0 28px 55px -12px rgba(20, 14, 48, 0.24),
        0 16px 32px -16px rgba(20, 14, 48, 0.16),
        0 4px 10px -2px rgba(20, 14, 48, 0.07),
        0 0 0 1px rgba(255, 255, 255, 0.6);
      user-select: none;
      flex-shrink: 0;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    }

    /* =======================================================
       BASE BACKGROUND LAYER (Right Phone Template Structure)
       ======================================================= */
    .base-background-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #ffffff;
      pointer-events: none;
      overflow: hidden;
    }

    /* Top Deep Purple Header Art (height: 295px) */
    .base-header-art {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 295px;
      overflow: hidden;
    }

    /* Base Orange Banner Shape */
    .base-orange-banner {
      position: absolute;
      top: 132px;
      left: 16px;
      right: 16px;
      height: 48px;
      border-radius: 9px;
      background: linear-gradient(90deg, #fa7f4e 0%, #f57749 55%, #ee6e45 100%);
      box-shadow: 0 6px 14px rgba(18, 8, 42, 0.22);
    }

    /* Base Dark Indigo Promo Cards (top: 192px) */
    .base-promo-left {
      position: absolute;
      top: 192px;
      left: 16px;
      width: 218px;
      height: 78px;
      border-radius: 10px;
      background: #190f3c;
      overflow: hidden;
    }

    .base-promo-right {
      position: absolute;
      top: 192px;
      left: 244px;
      width: 96px;
      height: 78px;
      border-radius: 10px;
      background: #190f3c;
    }

    /* Base Live Class 4 Gray Circles Row (top: 326px) */
    .base-live-circles-row {
      position: absolute;
      top: 326px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .base-circle-outer {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      border: 3.5px solid #dcdde2;
      padding: 1.5px;
      background: #ffffff;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .base-circle-inner {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: #dcdde2;
    }

    /* Base Section Titles ("Favorite Subject") */
    .base-section-title-1 {
      position: absolute;
      top: 418px;
      left: 16px;
      font-size: 13px;
      font-weight: 700;
      color: #1b1536;
      letter-spacing: -0.2px;
      line-height: 1;
    }

    .base-section-title-2 {
      position: absolute;
      top: 576px;
      left: 16px;
      font-size: 13px;
      font-weight: 700;
      color: #1b1536;
      letter-spacing: -0.2px;
      line-height: 1;
    }

    /* Base 2x4 Dark Indigo Subject Icon Boxes (top: 444px) */
    .base-subject-grid {
      position: absolute;
      top: 444px;
      left: 16px;
      right: 16px;
      display: grid;
      grid-template-columns: repeat(4, 58px);
      justify-content: space-between;
      row-gap: 24px;
    }

    .base-subject-box {
      width: 58px;
      height: 46px;
      border-radius: 11px;
      background: #1c1447;
    }

    /* Base Bottom Gray Thumbnail Placeholder (top: 604px) */
    .base-bottom-thumb {
      position: absolute;
      top: 604px;
      left: 16px;
      width: 62px;
      height: 44px;
      border-radius: 6px;
      background: #e1e2e6;
    }

    /* Base Bottom White Tab Bar Strip (bottom: 0, height: 52px) */
    .base-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: #ffffff;
      border-top: 1px solid #f2f2f6;
    }

    /* =======================================================
       FOREGROUND UI LAYER (Left Phone Populated Content)
       ======================================================= */
    .foreground-ui-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      transition: opacity 0.25s ease;
    }

    .foreground-ui-layer.layer-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Controls Bar Styling */
    .mode-btn {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      color: #4c4760;
      transition: all 0.2s ease;
      cursor: pointer;
      white-space: nowrap;
    }

    .mode-btn.active {
      background: #1c1447;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(28, 20, 71, 0.25);
    }

    .mode-btn:not(.active):hover {
      background: rgba(28, 20, 71, 0.07);
      color: #181524;
    }

    /* Clickable Button Elements (Managed by GSAP contextSafe animations - no CSS transform transition conflicts) */
    .subject-item,
    .live-item,
    .premium-banner-btn,
    .promo-card-btn,
    .course-card-btn {
      cursor: pointer;
      border: none;
      outline: none;
      will-change: transform;
      -webkit-tap-highlight-color: transparent;
    }

    .subject-item {
      background: #1c1447;
      border-radius: 11px;
      box-shadow: 0 4px 10px rgba(28, 20, 71, 0.18);
    }

    .subject-item.is-selected {
      background: linear-gradient(145deg, #2d1f6e 0%, #1c1447 100%);
      box-shadow: 0 6px 16px rgba(235, 125, 87, 0.38), 0 0 0 2px #eb7d57;
    }

    /* Hide static base boxes in main phone while foreground buttons are active so button divs move as one unit */
    #main-phone.foreground-active .base-subject-grid,
    #main-phone.foreground-active .base-orange-banner,
    #main-phone.foreground-active .base-promo-left,
    #main-phone.foreground-active .base-promo-right,
    #main-phone.foreground-active .base-live-circles-row,
    #main-phone.foreground-active .base-bottom-thumb {
      opacity: 0;
    }

    @media (max-width: 380px) {
      .phone-frame {
        transform: scale(0.92);
        transform-origin: top center;
        margin-bottom: -50px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Interactive View Switcher & Layer Opacity Slider -->
  <header class="mb-6 flex flex-col sm:flex-row items-center gap-3 z-20">
    <div class="bg-white/85 backdrop-blur-md p-1.5 rounded-full shadow-sm border border-white/80 flex items-center gap-1">
      <button id="btn-sidebyside" onclick="setViewMode('sidebyside')" class="mode-btn active">
        Side-by-Side View
      </button>
      <button id="btn-completed" onclick="setViewMode('completed')" class="mode-btn">
        Completed Screen (Left)
      </button>
      <button id="btn-base" onclick="setViewMode('base')" class="mode-btn">
        Base Background (Right)
      </button>
    </div>

    <!-- Opacity Slider for inspecting Foreground UI over Base Background -->
    <div id="layer-inspector" class="bg-white/85 backdrop-blur-md px-4 py-1.5 rounded-full shadow-sm border border-white/80 flex items-center gap-2.5 text-xs font-medium text-[#4c4760]">
      <span>Foreground Overlay</span>
      <input
        id="opacity-slider"
        type="range"
        min="0"
        max="100"
        value="100"
        oninput="updateLayerOpacity(this.value)"
        class="w-20 accent-[#1c1447] cursor-pointer h-1.5 bg-[#d5deed] rounded-lg"
        title="Fade foreground UI to inspect how every element aligns on top of the base background template"
      />
      <span id="opacity-label" class="w-8 text-right font-semibold text-[#1c1447]">100%</span>
    </div>
  </header>

  <!-- Main Stage: Left Populated Phone + Right Base Background Phone -->
  <main id="phones-stage" class="flex flex-col lg:flex-row items-center justify-center gap-10 lg:gap-20 transition-all duration-300">

    <!-- =================================================================
         PHONE 1 (LEFT): COMPLETED SCREEN BUILT OVER THE BASE BACKGROUND
         ================================================================= -->
    <div id="primary-phone-wrapper" class="flex flex-col items-center">
      <div class="phone-frame foreground-active" id="main-phone">

        <!-- 1. UNDERLYING BASE BACKGROUND LAYER (Identical to Right Phone) -->
        <div class="base-background-layer">
          <!-- Wavy Deep Purple Header SVG -->
          <div class="base-header-art">
            <svg viewBox="0 0 320 295" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <!-- Main deep purple-to-violet diagonal gradient -->
                <linearGradient id="headerBgGrad" x1="0%" y1="0%" x2="95%" y2="95%">
                  <stop offset="0%" stop-color="#140b2e" />
                  <stop offset="42%" stop-color="#251152" />
                  <stop offset="76%" stop-color="#431b8e" />
                  <stop offset="100%" stop-color="#6124c2" />
                </linearGradient>

                <!-- Upper dark midnight wave overlay -->
                <linearGradient id="upperWaveGrad" x1="0%" y1="0%" x2="100%" y2="40%">
                  <stop offset="0%" stop-color="#13092c" />
                  <stop offset="60%" stop-color="#1b0e3e" />
                  <stop offset="100%" stop-color="#271357" />
                </linearGradient>

                <!-- Translucent violet wave rim gradient -->
                <linearGradient id="rimVioletGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#5e3d9e" stop-opacity="0.72" />
                  <stop offset="50%" stop-color="#6d43bc" stop-opacity="0.75" />
                  <stop offset="100%" stop-color="#804ed6" stop-opacity="0.78" />
                </linearGradient>
              </defs>

              <!-- Base Purple Backdrop -->
              <rect width="320" height="295" fill="url(#headerBgGrad)" />

              <!-- Subtle Upper Sweeping Wave Contour -->
              <path
                d="M 0,0 L 320,0 L 320,88
                   C 278,96 242,58 190,42
                   C 132,24 62,38 0,78 Z"
                fill="url(#upperWaveGrad)"
                opacity="0.65"
              />

              <!-- Translucent Violet Wave Rim (6px above white wave) -->
              <path
                d="M 0,275
                   C 15,269 27,263 42,263
                   C 67,263 87,285 118,285
                   C 149,285 169,263 195,263
                   C 221,263 241,285 271,285
                   C 293,285 306,271 320,269
                   L 320,295 L 0,295 Z"
                fill="url(#rimVioletGrad)"
              />

              <!-- Crisp White Bottom 3-Crest Wave Divider -->
              <path
                d="M 0,281
                   C 15,275 27,269 42,269
                   C 67,269 87,291 118,291
                   C 149,291 169,269 195,269
                   C 221,269 241,291 271,291
                   C 293,291 306,277 320,275
                   L 320,296 L 0,296 Z"
                fill="#ffffff"
              />
            </svg>
          </div>

          <!-- Base Orange Banner -->
          <div class="base-orange-banner"></div>

          <!-- Base Dark Indigo Promo Cards -->
          <div class="base-promo-left"></div>
          <div class="base-promo-right"></div>

          <!-- Base Live Class 4 Gray Circles -->
          <div class="base-live-circles-row">
            <div class="base-circle-outer"><div class="base-circle-inner"></div></div>
            <div class="base-circle-outer"><div class="base-circle-inner"></div></div>
            <div class="base-circle-outer"><div class="base-circle-inner"></div></div>
            <div class="base-circle-outer"><div class="base-circle-inner"></div></div>
          </div>

          <!-- Base "Favorite Subject" Section Headings -->
          <div class="base-section-title-1">Favorite Subject</div>
          <div class="base-section-title-2">Favorite Subject</div>

          <!-- Base 2x4 Dark Indigo Subject Boxes -->
          <div class="base-subject-grid">
            <div class="base-subject-box"></div>
            <div class="base-subject-box"></div>
            <div class="base-subject-box"></div>
            <div class="base-subject-box"></div>
            <div class="base-subject-box"></div>
            <div class="base-subject-box"></div>
            <div class="base-subject-box"></div>
            <div class="base-subject-box"></div>
          </div>

          <!-- Base Bottom Gray Thumbnail Placeholder -->
          <div class="base-bottom-thumb"></div>

          <!-- Base Bottom White Tab Bar -->
          <div class="base-bottom-bar"></div>
        </div>

        <!-- 2. FOREGROUND UI CONTENT LAYER (Left Screen Elements) -->
        <div class="foreground-ui-layer" id="foreground-layer">

          <!-- Status Bar (top: 12px) -->
          <div class="absolute top-[12px] left-[22px] right-[16px] flex items-center justify-between z-10">
            <span class="text-white text-[11.5px] font-semibold tracking-[-0.2px] leading-none">
              9:41
            </span>
            <!-- Cellular, Wi-Fi, Battery Icons -->
            <div class="flex items-center gap-[5px]">
              <!-- Signal Bars -->
              <svg width="14" height="10" viewBox="0 0 14 10" fill="none">
                <rect x="0.5" y="6.5" width="2.2" height="3" rx="0.6" fill="#ffffff"/>
                <rect x="3.8" y="4.8" width="2.2" height="4.7" rx="0.6" fill="#ffffff"/>
                <rect x="7.1" y="2.8" width="2.2" height="6.7" rx="0.6" fill="#ffffff"/>
                <rect x="10.4" y="0.8" width="2.2" height="8.7" rx="0.6" fill="#ffffff" fill-opacity="0.4"/>
              </svg>
              <!-- Wi-Fi -->
              <svg width="13" height="10" viewBox="0 0 13 10" fill="none">
                <path d="M6.5 8.8C7.05 8.8 7.5 8.35 7.5 7.8C7.5 7.25 7.05 6.8 6.5 6.8C5.95 6.8 5.5 7.25 5.5 7.8C5.5 8.35 5.95 8.8 6.5 8.8Z" fill="#ffffff"/>
                <path d="M3.6 5.6C5.2 4.2 7.8 4.2 9.4 5.6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
                <path d="M1.4 3.4C4.2 1.0 8.8 1.0 11.6 3.4" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              <!-- Battery -->
              <svg width="20" height="10" viewBox="0 0 20 10" fill="none">
                <rect x="0.6" y="1" width="16" height="8" rx="2" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1"/>
                <rect x="2" y="2.4" width="11.5" height="5.2" rx="1" fill="#ffffff"/>
                <path d="M17.8 3.5V6.5C18.5 6.2 18.8 5.6 18.8 5C18.8 4.4 18.5 3.8 17.8 3.5Z" fill="#ffffff" fill-opacity="0.65"/>
              </svg>
            </div>
          </div>

          <!-- Greeting Text ("Hello, Ohaio !") -->
          <div class="absolute top-[41px] left-[16px] z-10">
            <h1 class="text-white text-[18.5px] font-bold tracking-[-0.3px] leading-tight">
              Hello, Ohaio !
            </h1>
            <p class="text-[#c0b7de] text-[10.5px] font-normal tracking-[-0.1px] mt-[2px]">
              What do you went to learn ladey?
            </p>
          </div>

          <!-- Notification Bell Icon (top-right) -->
          <button
            class="absolute top-[43px] right-[15px] w-6 h-6 flex items-center justify-center rounded-full hover:bg-white/10 transition z-20"
            aria-label="Notifications"
          >
            <svg width="14" height="15" viewBox="0 0 14 15" fill="none">
              <path d="M7 1.5C4.79 1.5 3 3.29 3 5.5V8.8L1.8 10.5C1.55 10.85 1.8 11.35 2.22 11.35H11.78C12.2 11.35 12.45 10.85 12.2 10.5L11 8.8V5.5C11 3.29 9.21 1.5 7 1.5Z" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5.4 11.8C5.65 12.6 6.25 13.1 7 13.1C7.75 13.1 8.35 12.6 8.6 11.8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>

          <!-- Cute Fluffy Purple Mascot Peeking Over the Search Bar (Full Unclipped Mascot) -->
          <div id="home-mascot-btn" class="absolute top-[20px] right-[29px] w-[76px] h-[72px] z-10 cursor-pointer" title="Click or drag mascot!">

    // Register GSAP Plugins (gsap-plugins, gsap-core, gsap-react skills)

    // Project defaults (gsap-core skill)
    gsap.defaults({ duration: 0.45, ease: "power2.out" });
    CustomEase.create("springPop", "M0,0 C0.14,0 0.26,1.32 0.52,1.06 0.72,0.9 0.84,1 1,1");
    CustomEase.create("SquashPress", "M0,0 C0.2,0 0.35,1 1,1");
    CustomEase.create("JellyBounce", "M0,0 C0.12,0 0.22,1.45 0.46,0.92 0.65,0.78 0.8,1.06 1,1");

    const mainPhone = document.getElementById('main-phone');
    const foregroundLayer = document.getElementById('foreground-layer');
    const primaryPhone = document.getElementById('primary-phone-wrapper');
    const secondaryPhone = document.getElementById('secondary-phone-wrapper');
    const opacitySlider = document.getElementById('opacity-slider');
    const opacityLabel = document.getElementById('opacity-label');
    const homeMascot = document.getElementById('home-mascot-img');
    const featuredCourseSubject = document.getElementById('featured-course-subject');
    const featuredCourseTitle = document.getElementById('featured-course-title');
    const featuredCourseBtn = document.getElementById('featured-course-btn');

    const btnSideBySide = document.getElementById('btn-sidebyside');
    const btnCompleted = document.getElementById('btn-completed');
    const btnBase = document.getElementById('btn-base');

    let reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Scoped gsap.context() with contextSafe event callbacks & cleanup (gsap-react skill best practice)
    const appCtx = gsap.context((self) => {
      if (!reduceMotion) {
        const tl = gsap.timeline();
        tl.from(".phone-frame", { y: 20, autoAlpha: 0, stagger: 0.1, duration: 0.6, ease: "power3.out" })
          .from(homeMascot, { y: 24, scale: 0.75, rotation: -10, duration: 0.75, ease: "elastic.out(1, 0.42)" }, "-=0.4")
          .from(".live-item", { y: 12, autoAlpha: 0, stagger: 0.06, duration: 0.4, clearProps: "transform" }, "-=0.45")
          .from(".subject-item", { scale: 0.8, autoAlpha: 0, stagger: 0.04, duration: 0.38, ease: "back.out(1.8)", clearProps: "transform" }, "-=0.35");

        // Subtle idle breathing float on mascot
        gsap.to(homeMascot, {
          y: -3,
          rotation: 2.5,
          duration: 2.0,
          ease: "sine.inOut",
          repeat: -1,
          yoyo: true
        });
      }

      // Context-safe interactive button animations (gsap-react contextSafe pattern)
      const bindInteractiveButton = self.add((el) => {
        const icon = el.querySelector('.btn-icon, svg');
        const accent = el.querySelector('.accent-shape');
        const label = el.querySelector('.subject-label');

        const onEnter = self.add(() => {
          if (reduceMotion) return;
          gsap.to(el, { scale: 1.08, y: -3, duration: 0.24, ease: "springPop", overwrite: "auto" });
          if (icon) {
            gsap.to(icon, { scale: 1.12, rotation: -4, duration: 0.24, ease: "back.out(2)", overwrite: "auto" });
          }
          if (label) {
            gsap.to(label, { y: 1.5, color: "#eb7d57", duration: 0.2, overwrite: "auto" });
          }
        });

        const onLeave = self.add(() => {
          if (reduceMotion) return;
          gsap.to(el, { scale: 1, y: 0, rotation: 0, duration: 0.32, ease: "power2.out", overwrite: "auto" });
          if (icon) {
            gsap.to(icon, { scale: 1, rotation: 0, y: 0, duration: 0.32, ease: "power2.out", overwrite: "auto" });
          }
          if (label && !el.classList.contains('is-selected')) {
            gsap.to(label, { y: 0, color: "#2c2647", duration: 0.2, overwrite: "auto" });
          }
        });

        const onDown = self.add(() => {
          if (reduceMotion) return;
          // Squash & press down on the entire button div
          gsap.to(el, {
            scaleX: 1.1,
            scaleY: 0.86,
            y: 2,
            duration: 0.1,
            ease: "SquashPress",
            overwrite: "auto"
          });
          if (icon) {
            gsap.to(icon, { scale: 0.88, y: 1, duration: 0.1, overwrite: "auto" });
          }
        });

        const onUp = self.add(() => {
          if (reduceMotion) return;
          // Jelly rebound on release + icon wiggle burst
          const pressTl = gsap.timeline({ overwrite: "auto" });
          pressTl.to(el, {
            scaleX: 0.94,
            scaleY: 1.12,
            y: -5,
            duration: 0.16,
            ease: "power2.out"
          }).to(el, {
            scaleX: 1,
            scaleY: 1,
            y: 0,
            duration: 0.52,
            ease: "elastic.out(1.2, 0.35)"
          });

          if (icon) {
            gsap.fromTo(
              icon,
              { rotation: -12, scale: 1.24, y: -3 },
              {
                rotation: 0,
                scale: 1,
                y: 0,
                duration: 0.55,
                ease: "elastic.out(1.3, 0.3)"
              }
            );
          }

          if (accent) {
            gsap.fromTo(
              accent,
              { scale: 1.45, transformOrigin: "50% 50%" },
              { scale: 1, duration: 0.48, ease: "JellyBounce" }
            );
          }
        });

        const onClick = self.add(() => {
          // If this is a subject button, highlight it and animate the featured course card with TextPlugin + Flip
          if (el.classList.contains('subject-item')) {
            document.querySelectorAll('.subject-item').forEach((item) => {
              item.classList.remove('is-selected');
              const itemLbl = item.querySelector('.subject-label');
              if (itemLbl) gsap.to(itemLbl, { color: "#2c2647", y: 0, duration: 0.2 });
            });
            el.classList.add('is-selected');
            if (label) {
              gsap.to(label, { color: "#eb7d57", y: 0, duration: 0.2 });
            }

            const subjectName = el.getAttribute('data-subject');
            const courseName = el.getAttribute('data-course');
            if (subjectName && courseName && featuredCourseSubject && featuredCourseTitle) {
              gsap.fromTo(
                featuredCourseBtn,
                { scale: 0.95, y: 4 },
                { scale: 1, y: 0, duration: 0.45, ease: "JellyBounce", overwrite: "auto" }
              );
              gsap.to(featuredCourseSubject, { duration: 0.25, text: subjectName, ease: "none" });
              gsap.to(featuredCourseTitle, { duration: 0.35, text: courseName, ease: "none" });
            }

            // Mascot cheers when a subject button is clicked
            gsap.fromTo(
              homeMascot,
              { scale: 1.16, y: -7, rotation: -8 },
              { scale: 1, y: 0, rotation: 0, duration: 0.6, ease: "elastic.out(1.2, 0.35)", overwrite: "auto" }
            );
          }
        });

        el.addEventListener('mouseenter', onEnter);
        el.addEventListener('mouseleave', onLeave);
        el.addEventListener('pointerdown', onDown);
        el.addEventListener('pointerup', onUp);
        el.addEventListener('click', onClick);
      });

      document.querySelectorAll(
        '#main-phone button, #main-phone .subject-item, #main-phone .live-item, .mode-btn'
      ).forEach(bindInteractiveButton);

      // Make the mascot interactive with GSAP Draggable + elastic snap-back
      Draggable.create("#home-mascot-btn", {
        type: "x,y",
        bounds: { minX: -12, maxX: 12, minY: -12, maxY: 8 },
        edgeResistance: 0.75,
        onPress() {
          gsap.to(homeMascot, { scale: 1.14, rotation: -8, duration: 0.2, ease: "back.out(2)" });
        },
        onRelease() {
          gsap.to(this.target, { x: 0, y: 0, duration: 0.6, ease: "elastic.out(1.1, 0.35)" });
          gsap.to(homeMascot, { scale: 1, rotation: 0, duration: 0.6, ease: "elastic.out(1.1, 0.35)" });
        }
      });
    }, document.body);

    function setViewMode(mode) {
      const state = Flip.getState([primaryPhone, secondaryPhone, btnSideBySide, btnCompleted, btnBase]);
      [btnSideBySide, btnCompleted, btnBase].forEach(btn => btn.classList.remove('active'));

      if (mode === 'sidebyside') {
        btnSideBySide.classList.add('active');
        secondaryPhone.classList.remove('hidden');
        secondaryPhone.classList.add('flex');
        foregroundLayer.classList.remove('layer-hidden');
        updateLayerOpacity(100);
        opacitySlider.value = 100;
      } else if (mode === 'completed') {
        btnCompleted.classList.add('active');
        secondaryPhone.classList.add('hidden');
        secondaryPhone.classList.remove('flex');
        foregroundLayer.classList.remove('layer-hidden');
        updateLayerOpacity(100);
        opacitySlider.value = 100;
      } else if (mode === 'base') {
        btnBase.classList.add('active');
        secondaryPhone.classList.add('hidden');
        secondaryPhone.classList.remove('flex');
        updateLayerOpacity(0);
        opacitySlider.value = 0;
      }

      if (!reduceMotion) {
        Flip.from(state, {
          duration: 0.48,
          ease: "springPop",
          scale: true
        });
      }
    }

    function updateLayerOpacity(val) {
      const num = Number(val);
      if (num > 85) {
        mainPhone.classList.add('foreground-active');
      } else {
        mainPhone.classList.remove('foreground-active');
      }
      gsap.to(foregroundLayer, {
        autoAlpha: num / 100,
        duration: reduceMotion ? 0 : 0.25,
        ease: "power2.out",
        overwrite: "auto"
      });
      foregroundLayer.style.pointerEvents = num < 15 ? 'none' : 'auto';
      opacityLabel.textContent = `${num}%`;
    }
  </script>
</body>
</html>

  <style>
    :root {
      --bg-canvas: #f2f3f4;
      --coral: #eb7d57;
      --coral-dark: #e06842;
      --dark-indigo: #18152d;
      --deep-purple: #1b0e3f;
      --mid-purple: #5928c9;
      --soft-lavender: #d7d1f8;
      --surface-card: #ffffff;
      --surface-muted: #f6f5fb;
      --text-muted: #8b87a0;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f2f3f4;
      background-image: 
        radial-gradient(ellipse 65% 85% at 98% 50%, rgba(238, 130, 190, 0.22) 0%, rgba(179, 140, 216, 0.14) 40%, rgba(99, 142, 242, 0.05) 70%, transparent 100%),
        radial-gradient(circle at 92% 12%, rgba(238, 130, 190, 0.18) 0%, transparent 55%);
      background-attachment: fixed;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      color: var(--dark-indigo);
    }

    
    /* StudyUp Official Brand Gradient */
    .studyup-brand-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #638ef2 0%, #8e8ee5 25%, #b38cd8 50%, #bc81c0 75%, #ee82be 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* Phone Frame Styling (99% Our Created Design System) */
    .phone-frame {
      width: 356px;
      height: 768px;
      background-color: #f2f3f4;
      background-image: radial-gradient(ellipse 70% 85% at 100% 50%, rgba(238, 130, 190, 0.20) 0%, rgba(179, 140, 216, 0.12) 42%, rgba(99, 142, 242, 0.04) 75%, transparent 100%);
      border-radius: 38px;
      box-shadow:
        0 26px 54px -12px rgba(24, 21, 45, 0.16),
        0 8px 20px -4px rgba(24, 21, 45, 0.07),
        0 0 0 1px rgba(255, 255, 255, 0.95) inset;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    }

    .phone-frame.highlight-ring {
      box-shadow:
        0 30px 64px -10px rgba(89, 40, 201, 0.30),
        0 0 0 3px #eb7d57;
    }

    /* Signature Deep Royal Purple Wavy Header */
    .purple-wave-header {
      background: linear-gradient(155deg, #1b0e3f 0%, #311770 42%, #5928c9 78%, #6828e0 100%);
      position: relative;
      overflow: hidden;
    }

    /* Hero Banner Gradient */
    .hero-banner-bg {
      background: linear-gradient(125deg, #1b0f3e 0%, #2f1b63 52%, #5c37a0 100%);
      position: relative;
      overflow: hidden;
    }

    /* Active Coral Pill Glow */
    .pill-coral-active {
      background: linear-gradient(135deg, #5b8df6 0%, #9084ea 45%, #ee82be 100%);
      color: #ffffff;
      border: 1px solid transparent;
      box-shadow: 0 7px 18px rgba(144, 132, 234, 0.45), 0 2px 5px rgba(238, 130, 190, 0.3);
    }

    .pill-outlined {
      background: #ffffff;
      color: #2c2647;
      border: 1.2px solid #e2e0ee;
      transition: all 0.2s ease;
    }

    .pill-outlined:hover {
      border-color: #5928c9;
      background: #f6f4fe;
    }

    /* Sleek Soft-Glow Purple Scholar UI Kit Cards */
    .edu-card {
      background: #ffffff;
      border: 1px solid rgba(221, 214, 254, 0.85);
      border-radius: 20px;
      box-shadow:
        0 10px 30px -5px rgba(105, 41, 212, 0.10),
        0 4px 12px -2px rgba(105, 41, 212, 0.05);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .edu-card:hover {
      transform: translateY(-2px);
      border-color: #c4b5fd;
      box-shadow:
        0 14px 34px -6px rgba(105, 41, 212, 0.16),
        0 6px 16px -3px rgba(105, 41, 212, 0.08);
    }

    .edu-card:active {
      transform: translateY(1px) scale(0.985);
    }

    .neu-inset {
      background: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      box-shadow: 0 2px 6px rgba(105, 41, 212, 0.04) !important;
    }

    .neu-flat {
      background: #ffffff;
      border: 1px solid rgba(221, 214, 254, 0.85);
      box-shadow: 0 4px 14px rgba(105, 41, 212, 0.07);
    }

    /* Soft Lavender Icon Badge */
    .badge-lavender {
      background: #ede9fe;
      color: #4c2bc2;
    }

    .badge-coral {
      background: #f0f2fe;
      color: #5b8df6;
    }

    .badge-emerald {
      background: #e8fbf3;
      color: #0d9462;
    }

    /* Notched Bottom Navigation Bar (Matching Uploaded Reference Image) */
    
    .notched-navbar-wrap {
      position: relative;
      width: 100%;
      height: 82px;
      flex-shrink: 0;
      z-index: 30;
      margin-top: auto;
    }

    .notched-navbar-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      filter: drop-shadow(0 -8px 24px rgba(10, 8, 20, 0.35));
      pointer-events: none;
    }

    .notched-fab {
      position: absolute;
      left: 50%;
      top: 0px;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #5b8df6 0%, #9084ea 45%, #ee82be 100%);
      box-shadow:
        0 8px 22px rgba(144, 132, 234, 0.55),
        0 2px 6px rgba(238, 130, 190, 0.35),
        0 0 0 3.5px #13111f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
      z-index: 40;
    }

    .notched-nav-items {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 8px 18px;
      z-index: 35;
    }

    .nav-tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 54px;
      padding: 4px 2px;
      color: #8e8ba0;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .nav-tab-btn:hover {
      color: #dcd9e8;
    }

    .nav-tab-btn.active {
      color: #ffffff;
      font-weight: 700;
    }

    .nav-tab-btn.active svg {
      stroke: #b38cd8;
    }

    /* Home Indicator Bar */
    .home-indicator {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 116px;
      height: 4px;
      background-color: #ffffff;
      opacity: 0.22;
      border-radius: 999px;
      z-index: 45;
      pointer-events: none;
    }


    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

  <script>
    // Progressive Disclosure: My Library Deck Filter & Drawer
    function toggleMoreDecks() {
      const more = document.getElementById('moreDecksContainer');
      const btn = document.getElementById('toggleMoreDecksBtn');
      if (!more || !btn) return;
      const isHidden = more.classList.contains('hidden');
      if (isHidden) {
        more.classList.remove('hidden');
        btn.textContent = 'Show Fewer Decks ↑';
        if (window.gsap) {
          gsap.fromTo(more.children, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.28, stagger: 0.06, ease: 'power2.out' });
        }
      } else {
        more.classList.add('hidden');
        btn.textContent = 'Show 2 More Decks (Elementary Sciences & JS) ↓';
      }
    }

    function filterLibraryDecks(cat, clickedBtn) {
      document.querySelectorAll('.lib-filter-btn').forEach(b => {
        b.classList.remove('pill-coral-active');
        b.classList.add('pill-outlined');
      });
      if (clickedBtn) {
        clickedBtn.classList.add('pill-coral-active');
        clickedBtn.classList.remove('pill-outlined');
      }
      const more = document.getElementById('moreDecksContainer');
      const toggleBtn = document.getElementById('toggleMoreDecksBtn');
      if (more) more.classList.remove('hidden');
      if (toggleBtn) toggleBtn.classList.add('hidden');

      document.querySelectorAll('#libraryDecksList .deck-item').forEach(card => {
        const match = (cat === 'all') || (card.getAttribute('data-cat') === cat);
        card.style.display = match ? '' : 'none';
      });
    }

    // Public Feed Search & Folder Filter
    function selectFolderPill(btn) {
      document.querySelectorAll('.folder-pill').forEach(b => {
        b.classList.remove('pill-coral-active');
        b.classList.add('pill-outlined');
      });
      btn.classList.add('pill-coral-active');
      btn.classList.remove('pill-outlined');
    }

    function filterFeedCard(q) {
      const card = document.getElementById('publicDeckCard');
      if (!card) return;
      const text = card.innerText.toLowerCase();
      card.style.display = text.includes((q || '').toLowerCase()) ? '' : 'none';
    }

    // Leaderboard Mode Switcher
    function switchRankTab(label, val, btn) {
      document.querySelectorAll('.rank-mode-btn').forEach(b => {
        b.classList.remove('pill-coral-active');
        b.classList.add('text-white/80');
      });
      btn.classList.add('pill-coral-active');
      btn.classList.remove('text-white/80');
      const lbl = document.getElementById('rankMetricLabel');
      const v = document.getElementById('rankMetricValue');
      const th = document.getElementById('tableMetricHeader');
      const r1 = document.getElementById('row1MetricVal');
      if (lbl) lbl.textContent = label;
      if (v) v.textContent = val;
      if (th) th.textContent = label;
      if (r1) r1.textContent = (label === 'Streak' ? '🔥 ' : '✨ ') + val;
    }

    // Android Progressive Disclosure Tabs
    function switchAndroidTab(tab, btn) {
      document.querySelectorAll('.android-tab-btn').forEach(b => {
        b.classList.remove('pill-coral-active');
        b.classList.add('pill-outlined');
      });
      btn.classList.add('pill-coral-active');
      btn.classList.remove('pill-outlined');
      const qr = document.getElementById('androidTabQR');
      const feat = document.getElementById('androidTabFeatures');
      if (tab === 'qr') {
        if (qr) qr.classList.remove('hidden');
        if (feat) feat.classList.add('hidden');
      } else {
        if (qr) qr.classList.add('hidden');
        if (feat) {
          feat.classList.remove('hidden');
          if (window.gsap) gsap.fromTo(feat.children, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.05 });
        }
      }
    }

    // Deck Study Modes Progressive Disclosure Category Filter
    function filterStudyModes(group, btn) {
      document.querySelectorAll('.mode-cat-btn').forEach(b => {
        b.classList.remove('pill-coral-active');
        b.classList.add('pill-outlined');
      });
      btn.classList.add('pill-coral-active');
      btn.classList.remove('pill-outlined');
      document.querySelectorAll('#studyModesGrid .study-mode-card').forEach(card => {
        if (card.getAttribute('data-mode-group') === group) {
          card.classList.remove('hidden');
          if (window.gsap) gsap.fromTo(card, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.22 });
        } else {
          card.classList.add('hidden');
        }
      });
    }

        // GSAP Core Showcase Engine (Spinning ONLY on Center FAB Button)
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.gsap) return;

      // 1. GSAP Stagger Entrance for Cards
      gsap.from('.edu-card', {
        y: 28,
        opacity: 0,
        duration: 0.65,
        stagger: {
          each: 0.09,
          from: 'start'
        },
        ease: 'back.out(1.5)',
        clearProps: 'transform'
      });

      // 2. Continuous Ambient Breathing & Exclusive Spinning ONLY on Center Action FAB Button
      const fab = document.querySelector('.notched-fab');
      if (fab) {
        gsap.to(fab, {
          scale: 1.06,
          duration: 1.7,
          repeat: -1,
          yoyo: true,
          ease: 'sine.inOut'
        });

        // Spinning is strictly ONLY on this center FAB button
        const spinFab = () => {
          const icon = fab.querySelector('svg');
          if (icon && !gsap.isTweening(icon)) {
            gsap.to(icon, {
              rotation: '+=360_cw',
              duration: 0.65,
              ease: 'power2.out'
            });
          }
        };
        fab.addEventListener('click', spinFab);
        fab.addEventListener('mouseenter', spinFab);
      }

      // Tactile Squash & Elastic Rebound Button Press
      document.querySelectorAll('.gsap-btn').forEach(btn => {
        btn.addEventListener('pointerdown', () => {
          gsap.to(btn, { scaleX: 1.06, scaleY: 0.90, duration: 0.09, ease: 'power2.out' });
        });
        const release = () => {
          gsap.to(btn, { scaleX: 1, scaleY: 1, duration: 0.4, ease: 'elastic.out(1.3, 0.35)' });
        };
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointerleave', release);
      });

      // Floating Mascot Bounce (Without spinning)
      const mascot = document.getElementById('mascot-screen1') || document.getElementById('mascot-screen2');
      if (mascot) {
        gsap.to(mascot, { y: -6, duration: 2.2, repeat: -1, yoyo: true, ease: 'sine.inOut' });
        mascot.addEventListener('click', () => {
          gsap.timeline()
            .to(mascot, { scaleX: 1.15, scaleY: 0.85, duration: 0.1, ease: 'power2.out' })
            .to(mascot, { scaleX: 0.95, scaleY: 1.08, y: -16, duration: 0.35, ease: 'power2.out' })
            .to(mascot, { scaleX: 1, scaleY: 1, y: 0, duration: 0.45, ease: 'elastic.out(1.1, 0.4)' });
        });
      }
    });
  </script>

  <style>
    :root {
      --bg-canvas: #F5F4F9;
      --dark-indigo: #140730;
      --deep-purple: #150734;
      --mid-purple: #6929D4;
      --soft-lavender: #DDD6FE;
      --surface-card: #FFFFFF;
      --text-muted: #64748B;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #FAFAFE;
      background-image:
        radial-gradient(ellipse 65% 85% at 98% 50%, rgba(232, 121, 249, 0.16) 0%, rgba(159, 103, 255, 0.10) 40%, rgba(103, 184, 247, 0.04) 70%, transparent 100%),
        radial-gradient(#CBD5E1 1.25px, transparent 1.25px);
      background-size: 100% 100%, 22px 22px;
      background-attachment: fixed;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      color: var(--dark-indigo);
    }

    /* StudyUp Official Brand Gradient */
    .studyup-brand-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #67B8F7 0%, #9F67FF 45%, #E879F9 80%, #F472B6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* Phone Frame Styling — Purple Scholar 356px Spec with Soft Glow */
    .phone-frame {
      width: 356px;
      height: 768px;
      background: linear-gradient(180deg, #F5F4F9 0%, #F9F5FA 55%, #F2EFF8 100%);
      border-radius: 38px;
      box-shadow:
        0 28px 65px -12px rgba(30, 11, 75, 0.28),
        0 0 40px -8px rgba(124, 58, 237, 0.16),
        0 0 0 1px rgba(255, 255, 255, 0.95) inset;
      border: 4px solid rgba(255, 255, 255, 0.9);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    }

    /* Signature Deep Royal Purple Wavy Header (Purple Scholar UI Kit) */
    .purple-wave-header {
      background: linear-gradient(135deg, #150734 0%, #2B0F66 42%, #5218B8 78%, #6929D4 100%);
      position: relative;
      overflow: hidden;
    }

    /* Active Create Orb & Pill Gradient with Soft Glow */
    .pill-coral-active,
    .create-orb-gradient {
      background: linear-gradient(165deg, #67B8F7 0%, #9B6BFF 45%, #E879F9 80%, #F472B6 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 20px rgba(155, 107, 255, 0.48), 0 0 12px rgba(244, 114, 182, 0.32);
    }

    .pill-outlined {
      background: #ffffff;
      color: #1E0B4B;
      border: 1px solid #EDE9FE;
      transition: all 0.2s ease;
    }

    .pill-outlined:hover {
      border-color: #9F67FF;
      background: #F6F4FF;
    }

    /* Minimalistic Sleek Soft-Glow Cards (Zero 3D Neumorphic Clay) */
    .edu-card {
      background: #FFFFFF;
      border: 1px solid rgba(221, 214, 254, 0.85);
      border-radius: 22px;
      box-shadow:
        0 10px 30px -5px rgba(105, 41, 212, 0.10),
        0 4px 12px -2px rgba(105, 41, 212, 0.05);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .edu-card:hover {
      border-color: #C4B5FD;
      box-shadow:
        0 16px 36px -6px rgba(105, 41, 212, 0.15),
        0 4px 14px -2px rgba(159, 103, 255, 0.08);
    }

    /* Ambient Pulse Ring for Header Concentric Circles */
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.28; }
      50% { transform: scale(1.05); opacity: 0.42; }
    }
    .animate-pulse-ring {
      animation: pulseRing 5s ease-in-out infinite;
    }

    /* Floating Crown Animation */
    @keyframes crownJump {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-5px) scale(1.08);
      }
    }

    .crown-jumping {
      animation: crownJump 2s ease-in-out infinite;
      display: inline-block;
      transform-origin: center bottom;
    }

    /* Podium Hierarchy Step Blocks (1st, 2nd, 3rd) */
    .podium-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      padding-top: 10px;
      margin-bottom: 2px;
    }

    .podium-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 96px;
      cursor: pointer;
    }

    .podium-step {
      width: 100%;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .podium-col:hover .podium-step {
      transform: translateY(-2px);
    }

    .podium-step-1 {
      height: 94px;
      background: linear-gradient(165deg, #35127A 0%, #1E0B4B 55%, #140730 100%);
      border: 1.5px solid rgba(251, 191, 36, 0.75);
      box-shadow:
        0 10px 24px -4px rgba(105, 41, 212, 0.35),
        0 0 18px rgba(245, 158, 11, 0.15);
    }

    .podium-step-2 {
      height: 70px;
      background: linear-gradient(180deg, #F6F4FF 0%, #EDE9FE 100%);
      border: 1px solid #DDD6FE;
      box-shadow: 0 4px 12px rgba(105, 41, 212, 0.06);
    }

    .podium-step-3 {
      height: 56px;
      background: linear-gradient(180deg, #FFFBEB 0%, #FEF3C7 100%);
      border: 1px solid #FDE68A;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.06);
    }

    /* Slide-Up Drawer Transitions inside Phone Frame */
    .drawer-backdrop {
      transition: opacity 0.26s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .drawer-sheet {
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Notched Obsidian Bottom Navigation Bar (#14141D Spec) */
    .notched-navbar-wrap {
      position: relative;
      width: 100%;
      height: 82px;
      flex-shrink: 0;
      z-index: 30;
      margin-top: auto;
    }

    .notched-navbar-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      filter: drop-shadow(0 -8px 24px rgba(13, 13, 18, 0.28));
      pointer-events: none;
    }

    .notched-fab {
      position: absolute;
      left: 50%;
      top: 0px;
      transform: translateX(-50%);
      width: 58px;
      height: 58px;
      border-radius: 9999px;
      background: linear-gradient(165deg, #67B8F7 0%, #9B6BFF 45%, #E879F9 80%, #F472B6 100%);
      box-shadow:
        0 6px 24px rgba(192, 132, 252, 0.65),
        0 0 16px rgba(236, 72, 153, 0.5),
        0 0 0 3.5px #14141D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
      z-index: 40;
    }

    .notched-nav-items {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 8px 16px;
      z-index: 35;
    }

    .nav-tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 56px;
      padding: 4px 2px;
      color: #94A3B8;
      transition: color 0.2s ease;
    }

    .nav-tab-btn:hover {
      color: #EDE9FE;
      cursor: pointer;
    }

    .nav-tab-btn.active {
      color: #FFFFFF;
      font-weight: 700;
    }

    .nav-tab-btn.active svg {
      stroke: #C4B5FD;
      filter: drop-shadow(0 0 8px rgba(196, 181, 253, 0.55));
    }

    /* Home Indicator Bar */
    .home-indicator {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 112px;
      height: 4px;
      background-color: #ffffff;
      opacity: 0.24;
      border-radius: 999px;
      z-index: 45;
      pointer-events: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .crown-jumping,
      .animate-pulse-ring {
        animation: none !important;
      }
    }
  </style>
</head>

    function switchRankTab(mode, btn) {
      currentMetricMode = mode;
      document.querySelectorAll('.rank-mode-btn').forEach(b => {
        b.classList.remove('pill-coral-active', 'font-bold');
        b.classList.add('text-purple-200/85', 'font-semibold');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('pill-coral-active', 'font-bold');
      btn.classList.remove('text-purple-200/85', 'font-semibold');
      btn.setAttribute('aria-selected', 'true');

      const data = rankMetricsData[mode];
      if (!data) return;

      const ids = [
        ['tableMetricHeader', data.header],
        ['podium1Metric', data.p1],
        ['podium2Metric', data.p2],
        ['podium3Metric', data.p3],
        ['row4Metric', data.r4],
        ['row5Metric', data.r5],
        ['row6Metric', data.r6]
      ];

      ids.forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (el) {
          el.textContent = val;
          if (window.gsap) {
            gsap.fromTo(el, { opacity: 0.2, y: 4 }, { opacity: 1, y: 0, duration: 0.24, ease: 'power2.out' });
          }
        }
      });
    }

    function claimRankBoost() {
      lawrenceXP += 50;
      const gap = lawrenceXP - 2120;
      const sub = document.getElementById('leadGapSubtitle');
      if (sub) {
        sub.textContent = `${gap.toLocaleString()} XP ahead of Rasty E. • Boost Active!`;
      }
      if (currentMetricMode === 'Score') {
        const p1 = document.getElementById('podium1Metric');
        if (p1) p1.textContent = lawrenceXP.toLocaleString() + ' XP';
      }
      showRanksToast(`+50 XP Added! You now have ${lawrenceXP.toLocaleString()} XP`);
    }

        </div>

        <h3 class="font-display font-extrabold text-base text-slate-900 mb-1">Weekly League Perks</h3>
        <p class="text-xs text-slate-500 mb-3">Finish in the Top 5 by Sunday 11:59 PM to unlock Grandmaster Scholar rewards.</p>

        <div class="space-y-2 mb-4 text-xs">
          <div class="p-3 rounded-xl bg-brand-50/90 border border-brand-200 flex items-center justify-between">
            <span class="font-bold text-brand-950">1st Place Champion Crown</span>
            <span class="font-mono font-bold text-brand-700">+250 Bonus XP</span>
          </div>
          <div class="p-3 rounded-xl bg-slate-50 border border-slate-200/80 flex items-center justify-between">
            <span class="font-semibold text-slate-800">2nd – 3rd Podium Finish</span>
            <span class="font-mono font-semibold text-slate-600">Streak Shield ×2</span>
          </div>
        </div>

        <button type="button" onclick="closePhoneDrawer()" class="w-full py-2.5 rounded-xl bg-obsidian-900 text-white font-bold text-xs">
          Got It
        </button>
      `;
    }

    function closePhoneDrawer() {
      const backdrop = document.getElementById('phone-drawer-backdrop');
      const sheet = document.getElementById('phone-drawer-sheet');
      if (backdrop) backdrop.classList.add('opacity-0', 'pointer-events-none');
      if (sheet) sheet.classList.add('translate-y-full');
    }

    let toastTimeout = null;
    function showRanksToast(msg) {
      const toast = document.getElementById('ranks-toast');
      const text = document.getElementById('ranks-toast-msg');
      if (!toast || !text) return;
      text.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-3');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-3');
      }, 2400);
    }

    // GSAP Core Showcase Engine (Spinning ONLY on Center FAB Button)
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.gsap) return;

      // 1. GSAP Stagger Entrance for Cards
      gsap.from('.edu-card', {
        y: 22,
        opacity: 0,
        duration: 0.55,
        stagger: 0.08,
        ease: 'power3.out',
        clearProps: 'transform,opacity'
      });

      // 2. Continuous Ambient Breathing & Exclusive Spinning ONLY on Center Action FAB Button
      const fab = document.querySelector('.notched-fab');
      if (fab) {
        gsap.to(fab, {
          scale: 1.05,
          duration: 1.8,
          repeat: -1,
          yoyo: true,
          ease: 'sine.inOut'
        });

        const spinFab = () => {
          const icon = fab.querySelector('svg');
          if (icon && !gsap.isTweening(icon)) {
            gsap.to(icon, {
              rotation: '+=360_cw',
              duration: 0.65,
              ease: 'power2.out'
            });
          }
        };
        fab.addEventListener('click', spinFab);
        fab.addEventListener('mouseenter', spinFab);
      }

      // 3. Tactile Squash & Elastic Rebound Button Press
      document.querySelectorAll('.gsap-btn').forEach(btn => {
        btn.addEventListener('pointerdown', () => {
          gsap.to(btn, { scaleX: 1.05, scaleY: 0.92, duration: 0.09, ease: 'power2.out' });
        });
        const release = () => {
          gsap.to(btn, { scaleX: 1, scaleY: 1, duration: 0.38, ease: 'elastic.out(1.2, 0.4)' });
        };
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointerleave', release);
      });
    });
  </script>

</body>
</html>
